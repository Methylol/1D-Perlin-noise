<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1D Perlin noise generation showcase</title>
    <style>
      body {
        margin: 0px;
      }
      #cv {
        width: 100vmin;
        height: 100vmin;
      }
      :root {
        color-scheme: light dark;
        --background: #ffffff;
        --text: #000000;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #121212;
          --text: #ffffff;
        }
      }
      html,
      body {
        background-color: var(--background);
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <canvas id="cv"></canvas>
    <script type="module">
      import GUI from "./node_modules/lil-gui/dist/lil-gui.esm.js";
      const cv = document.getElementById("cv");
      const gui = new GUI();
      const size =
        Math.min(window.innerWidth, window.innerHeight) *
        window.devicePixelRatio;
      cv.width = size;
      cv.height = size;
      /** @type {CanvasRenderingContext2D} */
      const gr = cv.getContext("2d");
      // Source - https://stackoverflow.com/a/47593316
      // Posted by bryc, modified by community. See post 'Timeline' for change history
      // Retrieved 2026-10-11, License - CC BY-SA 4.0
      function mulberry32(a) {
        a = (a * 2 ** 32) >>> 0; // edited; moved this conversion inside the function
        return function () {
          let t = (a += 0x6d2b79f5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      function smoothstep(x) {
        if (x < 0) return 0;
        return x > 1 ? 1 : 3 * x * x - 2 * x * x * x;
      }
      function smootherstep(x) {
        if (x < 0) return 0;
        return x > 1 ? 1 : x * x * x * (6 * x * x - 15 * x + 10);
      }
      function linearmap(x, d, r) {
        return ((r[1] - r[0]) / (d[1] - d[0])) * (x - d[0]) + r[0];
      }

      const data = {
        seed: 1,

        magnitude: 1,
        nodes: 4,
        octave: 1,
        accuracy: 100,
        pointSize: 0.004,
        gradients: false,
        interpolation: smootherstep,
      };

      function interpolate(x, l, r) {
        return data.interpolation(x) * (r - l) + l;
      }

      gui
        .add(data, "seed")
        .min(0)
        .max(999)
        .step(1)
        .listen()
        .onChange((v) => render());
      gui
        .add(data, "nodes")
        .min(2)
        .max(50)
        .step(1)
        .listen()
        .onFinishChange((v) => render());
      gui
        .add(data, "accuracy")
        .name("points")
        .min(2)
        .max(100)
        .step(1)
        .listen()
        .onFinishChange((v) => render());
      gui
        .add(data, "pointSize")
        .min(0.001)
        .max(0.02)
        .step(0.001)
        .listen()
        .onFinishChange((v) => render());
      gui.add(data, "gradients").onChange((v) => render());
      gui
        .add(data, "interpolation", {
          smoothstep,
          smootherstep,
          linear: (x) => x,
        })
        .onChange((v) => render());
      gr.scale(size / 2, -size / 2);
      gr.translate(1, -1);
      gr.scale(0.98, 0.98);
      function render() {
        // wahat I need to for rendering: the adjacent gradients and nodes,
        gr.clearRect(-1.5, -1.5, 4, 4);
        gr.fillStyle = "gray";
        gr.fillRect(-1.5, -1.5, 4, 4)
        gr.fillStyle = "blue";
        gr.fillRect(-1, -data.pointSize / 2, 2, data.pointSize);
        const rand = mulberry32(data.seed / 1000);

        const nodes = new Array(data.nodes).fill(0).map((_, i) => {
          const gradient = linearmap(rand(), [0, 1], [-1, 1]);
          const node = linearmap(i, [0, data.nodes - 1], [-1, 1]);
          return { node, gradient };
        });
        nodes.forEach((cn, i) => {
          function draw(x, y, style = "black", size = data.pointSize) {
            gr.fillStyle = style;
            gr.fillRect(x, y, size, size);
          }
          if (i + 1 == nodes.length) {
            draw(cn.node, 0, "red"); //node point lie on zero anyway. we shorten this for the last node but keep thw showcase for other nodes
            if (data.gradients) gr.fillRect(cn.node, 0, 0.005, cn.gradient);
            return;
          }
          const nn = nodes[i + 1];
          for (let p = 1; p < data.accuracy; p++) {
            const x = linearmap(p, [1, data.accuracy], [cn.node, nn.node]);
            const offsetl = x - cn.node;
            const offsetr = x - nn.node;
            let y = interpolate(
              linearmap(x, [cn.node, nn.node], [0, 1]),
              cn.gradient * offsetl,
              nn.gradient * offsetr,
            );
            y *= data.magnitude;
            if (p == 1) {
              draw(x, y, "red", data.pointSize * 2);
              if (data.gradients) gr.fillRect(x, y, 0.005, cn.gradient);
            } else draw(x, y);
          }
        });
      }
      render();
    </script>
  </body>
</html>
